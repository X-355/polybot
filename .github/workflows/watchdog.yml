name: Watchdog (alert if the bot stops reporting)
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          age=$(python3 -c "import json,datetime as d;u=json.load(open('data/summary.json'))['updated_utc'];t=d.datetime.strptime(u,'%Y-%m-%d %H:%M:%S').replace(tzinfo=d.timezone.utc);print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()//60))")
          echo "last report $age minutes ago"
          open=$(gh issue list -R ${{ github.repository }} --label bot-down --state open --json number -q '.[0].number')
          gh label create bot-down -R ${{ github.repository }} --color B60205 --description "Polybot stopped reporting" 2>/dev/null || true
          if [ "$age" -gt 120 ]; then
            if [ -z "$open" ]; then
              gh issue create -R ${{ github.repository }} --label bot-down --title "Polybot has not reported for $age minutes" \
                --body "The paper bot normally publishes every 30 minutes. Last report: $age minutes ago. Check the Lightsail server (Mumbai) is Running; if it is, open its browser terminal and run: sudo systemctl status polybot --no-pager; sudo journalctl -u polybot -n 40 --no-pager"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" -R ${{ github.repository }} --comment "Reporting again (last report $age minutes ago)."
          fi
      - name: ALT/BTC bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/altbtc/summary.json ] || { echo "ALT/BTC bot not reporting yet"; exit 0; }
          age=$(python3 -c "import json,datetime as d;u=json.load(open('data/altbtc/summary.json'))['updated_utc'];t=d.datetime.strptime(u,'%Y-%m-%d %H:%M:%S').replace(tzinfo=d.timezone.utc);print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()//60))")
          echo "ALT/BTC last report $age minutes ago"
          gh label create altbot-down -R ${{ github.repository }} --color B60205 --description "ALT/BTC bot stopped reporting" 2>/dev/null || true
          open=$(gh issue list -R ${{ github.repository }} --label altbot-down --state open --json number -q '.[0].number')
          if [ "$age" -gt 120 ]; then
            [ -n "$open" ] || gh issue create -R ${{ github.repository }} --label altbot-down --title "ALT/BTC bot has not reported for $age minutes" \
              --body "Publishes every 30 minutes. On the server run: sudo systemctl status altbot --no-pager; sudo journalctl -u altbot -n 40 --no-pager"
          elif [ -n "$open" ]; then
            gh issue close "$open" -R ${{ github.repository }} --comment "Reporting again ($age minutes ago)."
          fi
      - name: Polybot blind (reporting, but every recent check skipped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(python3 -c "import csv;r=list(csv.DictReader(open('data/decisions.csv')))[-24:];print(sum(x['status'].startswith('skipped') for x in r) if len(r)==24 else 0)")
          echo "skipped in the last 24 checks: $n"
          gh label create bot-blind -R ${{ github.repository }} --color D93F0B --description "Polybot is running but skipping every check" 2>/dev/null || true
          open=$(gh issue list -R ${{ github.repository }} --label bot-blind --state open --json number -q '.[0].number')
          if [ "$n" -ge 24 ]; then
            [ -n "$open" ] || gh issue create -R ${{ github.repository }} --label bot-blind --title "Polybot is skipping every check (stale data)" \
              --body "The last 24 checks (about 1 hour) were all skipped. See data/summary.json status.errors and skipped reasons."
          elif [ -n "$open" ]; then
            gh issue close "$open" -R ${{ github.repository }} --comment "Checks are going through again."
          fi
